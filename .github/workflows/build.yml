name: 构建APK

# 触发条件：推送到 main 分支，或手动触发
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: 云端编译 APK
    runs-on: ubuntu-latest

    steps:
      # 1) 拉取仓库代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2) 安装 JDK 17（AGP 8.5 要求）
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3) 缓存 Gradle 依赖，加速编译
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4) 生成自签名密钥（解决部分手机拒绝安装未签名 APK 的问题）
      #    用固定占位密码即可，自签名不涉及安全，仅为了让 APK 能被正常安装。
      - name: 生成自签名密钥
        run: |
          KEYSTORE=app/ci_keystore.jks
          rm -f $KEYSTORE
          keytool -genkeypair \
            -dname "CN=Hidden Dictation, OU=Dev, O=Local, L=CN, S=CN, C=CN" \
            -alias ci_key \
            -keypass android \
            -keystore $KEYSTORE \
            -storepass android \
            -validity 10000 \
            -keyalg RSA \
            -keysize 2048
          # 把密钥相关变量注入后续步骤的环境
          {
            echo "KEYSTORE_BASE64=$(base64 -w0 $KEYSTORE)"
            echo "KEYSTORE_PASSWORD=android"
            echo "KEY_ALIAS=ci_key"
            echo "KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      # 5) 赋予 gradlew 执行权限（Linux 必需）
      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      # 5.5) 把 HanziWriter 库本地化进 APK（彻底去掉对 jsdelivr CDN 的网络依赖，
      #      国内网络常被墙导致手写库加载失败、弹窗空白或秒关）。CI runner 有网，
      #      多源 fallback 下载到 assets，APK 安装后离线也能渲染田字格。
      - name: 下载 HanziWriter 库到 assets（本地化）
        run: |
          DEST=app/src/main/assets/hanzi-writer.min.js
          # 多源 fallback：任一可用即可
          for url in \
            "https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js" \
            "https://unpkg.com/hanzi-writer@3/dist/hanzi-writer.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/hanzi-writer/3.0.0/dist/hanzi-writer.min.js" ; do
            echo "尝试下载: $url"
            if curl -fsSL --retry 3 --connect-timeout 20 "$url" -o "$DEST" ; then
              echo "下载成功: $url"
              break
            fi
          done
          if [ -s "$DEST" ]; then
            echo "HanziWriter 库大小: $(wc -c < "$DEST") 字节"
          else
            echo "::warning::HanziWriter 下载失败，弹窗将走离线降级（仍可显示要写的字，只是无描红轨迹）"
            # 写一个最小占位，避免 index.html 引用 404（实际功能由前端离线降级兜底）
            echo "/* HanziWriter 离线占位：CI 下载失败，前端已做降级处理 */" > "$DEST"
          fi

      # 6) 编译 release APK（自动使用上方生成的签名）
      - name: 编译 assembleRelease
        run: ./gradlew assembleRelease --no-daemon

      # 7) 上传产物（已签名 APK），可在 Actions 页面下载
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: hidden-dictation-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
