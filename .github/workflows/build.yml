name: 构建未签名APK

# 触发条件：推送到 main 分支，或手动触发
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: 云端编译 APK
    runs-on: ubuntu-latest

    steps:
      # 1) 拉取仓库代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2) 安装 JDK 17（AGP 8.5 要求）
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3) 缓存 Gradle 依赖，加速编译
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4) 赋予 gradlew 执行权限（Linux 必需）
      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      # 5) 编译 release 未签名 APK
      - name: 编译 assembleRelease
        run: ./gradlew assembleRelease --no-daemon

      # 6) 上传产物（未签名 APK），可在 Actions 页面下载
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: hidden-dictation-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
