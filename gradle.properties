# gradle.properties（项目级 Gradle 参数）
# 启用 AndroidX（现代安卓组件库，Room/WebView 等都需要）
android.useAndroidX=true
# 不自动将旧 support 包迁移到 AndroidX（本项目从零写，全部 AndroidX）
android.nonTransitiveRfClass=false
android.enableJetifier=false

# JVM 参数：给 Gradle  daemon 足够堆内存，避免 GitHub Actions 上 OOM
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
# 并行编译加速
org.gradle.parallel=true
# 守护进程复用（CI 上会单独起）
org.gradle.daemon=true

# Kotlin 编译 JVM 目标 17（与 compileSdk 的 JDK 要求匹配）
kotlin.jvm.target.validation.mode=warning
